name: KayokoEditorTests
options:
  deploymentTarget:
    iOS: "14.0"
settings:
  base:
    CLANG_ENABLE_OBJC_ARC: YES
    CODE_SIGNING_ALLOWED: NO
targets:
  KayokoEditorTestHost:
    type: application
    platform: iOS
    sources:
      - Host
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mlgm.kayoko.editor-test-host
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
  KayokoFingerImageRendererTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - KayokoFingerImageRendererTests.m
      - KayokoFingerEditorLayoutTests.m
      - KayokoEditorRuntimeStubs.m
      - ../Core/Controllers/KayokoFingerEditorViewController.m
      - ../Core/Controllers/KayokoPreviewViewController.m
      - ../Core/Views/KayokoPreviewView.m
      - ../Core/Views/KayokoHeaderView.m
      - ../Core/Views/KayokoGrabberView.m
      - ../Core/Views/KayokoEdgeFadingTextView.m
      - ../Core/Views/KayokoEdgeFadeMaskController.m
      - ../Core/Manager/KayokoPasteboardItem.m
      - ../Core/Views/KayokoFingerCanvasView.m
      - ../Core/Views/KayokoFingerEditorControlsView.m
      - ../Core/Models/KayokoFingerImageRenderer.m
      - ../Core/Models/KayokoFingerImageRenderer.h
      - path: ../Preferences/Resources
        includes:
          - zh-Hans.lproj/Tweak.strings
          - en.lproj/Tweak.strings
        buildPhase: resources
    dependencies:
      - target: KayokoEditorTestHost
      - sdk: UIKit.framework
      - sdk: CoreImage.framework
      - sdk: ImageIO.framework
      - sdk: PhotosUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mlgm.kayoko.editor-tests
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: ""
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../Core/Controllers
          - $(SRCROOT)/../Core/Views
          - $(SRCROOT)/../Core/Models
          - $(SRCROOT)/../Core/Manager
          - $(SRCROOT)/../Core/Actions
schemes:
  KayokoEditorTests:
    build:
      targets:
        KayokoEditorTestHost: all
        KayokoFingerImageRendererTests: [test]
    test:
      targets:
        - KayokoFingerImageRendererTests
